<style>
:root{color-scheme:dark;--bg:#0b0b0c;--s:#151517;--line:#252528;--bd:#34343a;--tx:#ecebe5;--mut:#85857f;--ac:#d4ff3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}

.card{padding:18px 0;border-bottom:1px solid var(--line)}
.mut{color:var(--mut)}small{display:block;color:var(--mut);font-size:12px}

.sim.t4{background:linear-gradient(145deg,#e6c36a,#8a6420);color:#1a1204}

.reel{display:flex;flex-wrap:nowrap;align-items:center;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:clamp(16px,calc((100vw - 80px)/11.5),38px)}

.combo{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin-bottom:6px}

.vh{display:flex;align-items:center;gap:12px;margin-bottom:8px}.vh h2{margin:0;font-size:20px;letter-spacing:-.4px}
.view .vh{flex-direction:column;align-items:flex-start;gap:6px;padding:18px 0 6px}.view .vh h2{font-size:28px;letter-spacing:-.8px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--mut);font-size:13px;padding:4px 6px 4px 0}.back:hover{color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 0;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}td:last-child,th:last-child{text-align:right}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.st span{font-size:11px;letter-spacing:1px;text-transform:uppercase}.st b{display:block;font-size:20px;font-weight:600;letter-spacing:-.4px}
.st.big{grid-column:1/-1;padding:26px 0}.st.big b{font-size:48px;letter-spacing:-2px;color:var(--ac)}
.item{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 0 16px 16px}
.item::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;background:var(--rc,#555)}
.item.c1{--rc:#8b919c}.item.c2{--rc:#4c78ff}.item.c3{--rc:#a56bff}.item.c4{--rc:#e0b14c}
.item .num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:17px;font-weight:500;letter-spacing:-.4px}
.item .btn{width:auto;margin-left:auto;padding:10px 14px;font-size:13px}
.dd{position:relative;margin-left:auto}
.ddb{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:13px;box-shadow:inset 0 0 0 1px var(--bd)}
.ddm{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:#141416;box-shadow:0 0 0 1px var(--bd),0 16px 40px rgba(0,0,0,.6);border-radius:6px;padding:4px;z-index:5}

.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 12px;font-size:13px;color:var(--mut);box-shadow:inset 0 0 0 1px var(--bd)}.chip:hover{color:var(--tx)}.chip.on{background:var(--tx);color:#0b0b0c;box-shadow:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mb{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px;border-top:1px solid var(--bd);border-radius:14px 14px 0 0}

.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 0;border-radius:0;border-bottom:1px solid var(--line)}.li:hover{background:var(--s)}

.bonus{color:var(--ac);font-weight:600;font-size:14px;margin-top:4px}

#drawer{position:fixed;inset:0;z-index:20;pointer-events:none}

#onb{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:flex;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}

.btn[data-a=g],.btn[data-a=greg]{background:var(--tx)}.btn[data-a=g]:hover:not(:disabled),.btn[data-a=greg]:hover:not(:disabled){background:#fff}
.who{padding:18px 0;border-bottom:1px solid var(--line)}.who .nm{font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;word-break:break-word}
.reg{display:flex;align-items:center;gap:16px;padding:18px 0 18px 16px;border-bottom:1px solid var(--line);position:relative}
.reg::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;background:var(--ac)}
.msim{flex:none;position:relative;width:64px;height:40px;border-radius:6px;background:linear-gradient(145deg,#e6c36a,#8a6420);clip-path:polygon(0 0,76% 0,100% 28%,100% 100%,0 100%)}

.reg b{display:block;font-size:17px;letter-spacing:-.3px;line-height:1.25}.reg .btn{width:auto;margin-top:10px;padding:10px 14px;font-size:13px}
.who{position:relative}.btn[data-a=logout].conf{background:var(--tx);color:#0b0b0c}
.sech{padding:18px 0 14px;border-bottom:1px solid var(--line)}.sech h3{margin:0;font-size:30px;letter-spacing:-1px}
.gad{position:relative;display:flex;gap:16px;padding:20px 0 20px 16px;border-bottom:1px solid var(--line)}
.gad::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;background:transparent}.gad.on::before{background:var(--ac)}

.bl{margin-top:16px;text-align:left}.bl .cap{margin-bottom:4px}.br{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.br span{color:#bdbdb6}.br b{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;white-space:nowrap}.br.bt{border-bottom:0;padding-top:12px}.br.bt span{color:var(--tx);font-weight:600}.br.bt b{color:var(--ac);font-size:18px;font-weight:700}
#pc{width:100%;background:none;border:0;box-shadow:inset 0 0 0 1px var(--bd);border-radius:6px;padding:16px;font-size:18px;outline:0;text-transform:uppercase}#pc:focus{box-shadow:inset 0 0 0 1px var(--tx)}
.tk{display:grid;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.tk.dn{opacity:.5}

function whoHTML(){return `<div class="who"><div class="cap">Игрок</div><div class="nm">${esc(S.name||'Игрок')}</div><small>${S.acct==='google'?'Google · бета':'Гость'}</small></div>`+(S.acct==='google'?'':`<div class="reg"><div class="msim"></div><div><b>Зарегистрируйся, чтобы не потерять прогресс</b><button class="btn" data-a="greg">Войти через Google</button></div></div>`)}
function renderOnb(){
 const o=$('#onb');if(S.acct&&S.name){o.hidden=true;return}
 o.hidden=false;const head=`<div class="logo" style="cursor:default">${LOGO}</div>`;
 if(!S.acct)o.innerHTML=`<div class="ob">${head}<div class="sim t1"><div class="sh"><span class="brand">DialSpin</span></div><div class="mid"><svg class="chip2" viewBox="0 0 56 44"><defs><linearGradient id="gg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e7a8"/><stop offset=".5" stop-color="#d2a43c"/><stop offset="1" stop-color="#f1d47e"/></linearGradient></defs><rect x=".5" y=".5" width="55" height="43" rx="8" fill="url(#gg2)" stroke="rgba(0,0,0,.35)"/><g fill="none" stroke="rgba(70,45,0,.55)"><path d="M18 .5v14M38 .5v14M18 29.5v14M38 29.5v14M.5 15h55M.5 29h55"/><rect x="18" y="15" width="20" height="14" rx="3"/></g></svg></div><div class="reel done">${reelHTML(CM.RU,[9,0,0,7,7,7,0,0,0,0],0)}</div><div class="sf"><span>Россия</span><span>Редкий</span></div></div>
 <div><div class="cap">Шаг 1 из 2</div><h1>Лови красивые номера</h1></div><p>Крути виртуальные SIM-карты разных стран, продавай их или собирай коллекцию.</p>
 <div class="acts"><button class="btn" data-a="g"><b style="font-size:18px">G</b>Войти через Google</button><button class="btn alt" data-a="guest">Продолжить как гость</button></div>
 <p class="note">Бета-версия: любой вариант открывает игру. Вход через Google пока не подключён.</p></div>`;
 else{o.innerHTML=`<div class="ob">${head}<div><div class="cap">Шаг 2 из 2</div><h1>Как вас зовут?</h1></div><p>Имя будет показано в вашем профиле.</p><input id="nm" maxlength="20" placeholder="Ваше имя" autocomplete="nickname" value="${esc(S.name||'')}"><div class="acts"><button class="btn" data-a="name">Продолжить</button></div></div>`;setTimeout(()=>{const i=$('#nm');if(i)i.focus()},60)}}
function submitName(){const i=$('#nm');if(!i)return;const n=i.value.trim().replace(/\s+/g,' ');if(n.length<2){toast('Введите имя (от 2 символов)');return}S.name=n.slice(0,20);save();renderOnb();render();toast('Добро пожаловать, '+S.name)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='nm')submitName();else if(e.target.id==='pc')redeem()}});
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const freshDc=()=>({sold:0,kept:0,cty:[],sum:0,k3:0,big:0,rare:0,spins:0,maxBal:0,k2:0,k4:0,epic:0,sEpic:0});
function ensureDay(){const k=dayKey();if(!S.dq||S.dq.day!==k||!S.dc){S.dq={day:k,list:shuffle(CFG.tasks.map(t=>t.id)).slice(0,3).map(id=>({id,claimed:false}))};S.dc=freshDc();S.dc.maxBal=S.bal}}
function migrate(){S.col.forEach(x=>x.lv=KL[x.k]);if(S.cur)S.cur.lv=KL[S.cur.k];S.lv={1:0,2:0,3:0,4:0};for(const k in S.cc)S.lv[KL[k]]+=S.cc[k]}
function dayCount(g,c){ensureDay();const d=S.dc;d.spins++;if(g.k===2)d.k2++;if(g.k===3)d.k3++;if(g.k===4)d.k4++;if(g.lv===2)d.rare++;if(g.lv===3)d.epic++;if(!d.cty.includes(c.iso))d.cty.push(c.iso)}
function onSold(x){ensureDay();const d=S.dc,q=x.cp||1;d.sold+=q;d.sum+=x.pay;if(Math.round(x.pay/q)>7000)d.big++;if(x.lv===3)d.sEpic+=q}
const taskVal=t=>{const v=S.dc[t.key];return Array.isArray(v)?v.length:(v||0)};
function rTasks(){ensureDay();
 const now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)-now,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),L=n=>n.toLocaleString('ru-RU');
 $('#v-tasks').innerHTML=back('Задания')+`<div class="sech"><div class="cap">Ежедневные</div><h3>3 задания на сегодня</h3><p class="mut" style="margin:6px 0 0;font-size:13px">Новые задания через ${h} ч ${m} мин</p></div>`+S.dq.list.map(it=>{
  const t=CFG.tasks.find(x=>x.id===it.id),p=Math.min(taskVal(t),t.goal),done=p>=t.goal;
  const btn=it.claimed?'<span class="mut">Получено</span>':done?`<button class="btn" data-a="claim" data-v="${t.id}">Забрать</button>`:'<span class="mut">В процессе</span>';
  return `<div class="tk${it.claimed?' dn':''}"><div class="tkh"><div class="tkt">${t.t}</div><div class="tkr">+${R(t.rw)}</div></div><div class="bar"><i style="width:${Math.round(p/t.goal*100)}%"></i></div><div class="tkf"><span class="mut tn">${L(p)} / ${L(t.goal)}${t.u?' ₽':''}</span>${btn}</div></div>`}).join('')}
function rPromo(){$('#v-promo').innerHTML=back('Промокод')+`<div class="sech"><div class="cap">Активация</div><h3>Введите промокод</h3></div><div class="card"><input id="pc" maxlength="32" placeholder="Промокод" autocomplete="off" autocapitalize="characters"><div class="acts" style="margin-top:14px"><button class="btn" data-a="promo">Активировать</button></div></div>`}
function redeem(){const i=$('#pc');if(!i)return;const c=i.value.trim().toUpperCase();if(!c){toast('Введите промокод');return}const r=CFG.promos[c];if(!r){toast('Промокод не найден');return}if(S.promos.includes(c)){toast('Промокод уже использован');return}S.promos.push(c);S.bal+=r;save();render();toast('Промокод активирован: +'+R(r))}
function tipHTML(){return S.tnHide===dayKey()?'':`<div class="tip"><svg class="tic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="2.5" fill="#3ddc84"/><path d="M8 2.5v3M12 2.5v3M16 2.5v3" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round"/><path d="M8 11h8M8 15h8M8 19h5" stroke="#0b0b0c" stroke-width="1.6" stroke-linecap="round"/></svg><span>Выполняй задание и получай дополнительный бонус</span><button class="btn tgo" data-a="view" data-v="tasks">Перейти</button><button class="tx" data-a="tnhide" aria-label="Скрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`}
const CHIP='<svg class="chip2" viewBox="0 0 56 44"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e7a8"/><stop offset=".5" stop-color="#d2a43c"/><stop offset="1" stop-color="#f1d47e"/></linearGradient></defs><rect x=".5" y=".5" width="55" height="43" rx="8" fill="url(#gg)" stroke="rgba(0,0,0,.35)"/><g fill="none" stroke="rgba(70,45,0,.55)"><path d="M18 .5v14M38 .5v14M18 29.5v14M38 29.5v14M.5 15h55M.5 29h55"/><rect x="18" y="15" width="20" height="14" rx="3"/></g></svg>';
const skinPct=lv=>{const k=CFG.skins.find(x=>x.id===S.skin[lv]);return k?k.pct:0};
const skinPv=id=>`<div class="sim t0 sk-${id} pv"><div class="sh"><span class="brand">DialSpin</span></div><div class="mid">${CHIP}</div></div>`;
function skinRow(k,btn,extra){return `<div class="gad${extra.on?' on':''}"><div class="gimg sk">${skinPv(k.id)}</div><div class="gb"><div class="gn">Скин «${k.n}»</div><div class="mut" style="font-size:12px">Редкость: ${CFG.rarNames[k.lv-1]}</div><ul><li>${k.t}</li></ul><div class="gf">${extra.left}${btn}</div>${extra.low||''}</div></div>`}
function skinsSec(){return `<div class="sech" style="margin-top:10px"><div class="cap">Раздел 02</div><h3>Скины SIM карт</h3><p class="mut" style="margin:6px 0 0;font-size:13px">Скины покупаются здесь, а надеваются в инвентаре — по одному на каждую редкость.</p></div>`+CFG.skins.map(k=>{const own=S.sk.includes(k.id),lack=k.price-S.bal;
 const btn=own?'<button class="btn alt" disabled>В инвентаре</button>':`<button class="btn" data-a="buys" data-v="${k.id}" ${lack>0?'disabled':''}>Купить</button>`;
 return skinRow(k,btn,{left:`<span class="gp">${R(k.price)}</span>`,low:!own&&lack>0?`<small>Не хватает ${R(lack)}</small>`:''})}).join('')}
function invTabs(){return `<div class="tabs"><button class="${invTab==='n'?'on':''}" data-a="itab" data-v="n">Номера</button><button class="${invTab==='s'?'on':''}" data-a="itab" data-v="s">Скины${S.sk.length?' · '+S.sk.length:''}</button></div>`}
function rSkins(){$('#v-col').innerHTML=back('Инвентарь')+invTabs()+'<div class="lst">'+(S.sk.length?S.sk.map(id=>{const k=CFG.skins.find(x=>x.id===id),eq=S.skin[k.lv]===k.id;
 return skinRow(k,`<button class="btn${eq?' alt':''}" data-a="equip" data-v="${k.id}">${eq?'Снять':'Экипировать'}</button>`,{on:eq,left:`<span class="mut" style="font-size:12px">${eq?'Экипирован':'Не надет'}</span>`})}).join(''):'<div class="card center mut">Скинов пока нет. Купите их в Игровом Магазине.</div>')+'</div>'}
function tgHTML(){return `<div class="tip tg"><svg class="tic" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2" fill="#3ddc84"/><rect x="2" y="6.5" width="20" height="4.5" rx="1.5" fill="#2fc673"/><rect x="10.5" y="6.5" width="3" height="14.5" fill="#0b0b0c" opacity=".8"/><path d="M12 6.5C10 6.5 8.2 5.9 8.2 4.4 8.2 3.3 9.2 2.8 10 2.9c1.4.2 2 2.4 2 3.6zM12 6.5c2 0 3.8-.6 3.8-2.1 0-1.1-1-1.6-1.8-1.5-1.4.2-2 2.4-2 3.6z" fill="none" stroke="#3ddc84" stroke-width="1.5"/></svg><span>Секретные промокоды, новые обновления и другое уже в нашем Telegram канале</span><a class="btn tgo" href="https://t.me/dialspin" target="_blank" rel="noopener noreferrer">Перейти</a></div>`}
function openMenu(){document.querySelectorAll('#drawer .mi').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('#mc').textContent=S.col.length||'';$('#mbal').textContent=$('#bal').textContent;$('#drawer').classList.add('open')}
function closeMenu(){$('#drawer').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeM()}});
// ===== События =====
document.addEventListener('click',e=>{
 if(e.target.id==='modal')return closeM();
 if(ddOpen&&!e.target.closest('.dd')){ddOpen=false;rCol()}
 const t=e.target.closest('[data-a]');if(!t||t.tagName==='SELECT'||t.tagName==='INPUT')return;
 const a=t.dataset.a,v=t.dataset.v;
 if(a==='menu'){openMenu();return}
 if(a==='mclose'){closeMenu();return}
 if(t.closest('#drawer'))closeMenu();
 if(a==='view'){view=v;ddOpen=false;render();scrollTo(0,0)}
 else if(a==='dd'){ddOpen=!ddOpen;rCol()}else if(a==='srt'){sortBy=v;ddOpen=false;rCol()}
 else if(a==='spin')spin();else if(a==='sell')sell();else if(a==='keep')keep();else if(a==='sellc')sellc(v);
 else if(a==='pick')openPick();else if(a==='set')openSet();else if(a==='close')closeM();
 else if(a==='reg'){reg=v;pickList()}
 else if(a==='cty'){if(busy)return;S.iso=v;if(S.cur&&S.cur.st!=='pending')S.cur=null;save();closeM();render()}
 
 
 else if(a==='g'||a==='guest'){const f=S.fast;S=defS();S.fast=f;S.acct=a==='g'?'google':'guest';ensureDay();save();renderOnb()}
 else if(a==='name')submitName();
 else if(a==='promo')redeem();
 else if(a==='itab'){invTab=v;render()}
 else if(a==='buys'){const k=CFG.skins.find(x=>x.id===v);if(!k||S.sk.includes(k.id))return;if(S.bal<k.price){toast('Недостаточно средств');return}S.bal-=k.price;S.sk.push(k.id);save();render();toast('Скин «'+k.n+'» добавлен в инвентарь')}
 else if(a==='equip'){const k=CFG.skins.find(x=>x.id===v);if(!k||!S.sk.includes(k.id))return;S.skin[k.lv]=S.skin[k.lv]===k.id?'':k.id;repayAll();save();render();toast(S.skin[k.lv]?'Скин надет: '+k.n:'Скин снят')}
 else if(a==='tnhide'){S.tnHide=dayKey();save();render()}
 else if(a==='claim'){ensureDay();const it=S.dq.list.find(x=>x.id===v),t=CFG.tasks.find(x=>x.id===v);if(!it||!t||it.claimed||taskVal(t)<t.goal)return;it.claimed=true;S.bal+=t.rw;save();render();toast('Награда получена: +'+R(t.rw))}
 else if(a==='buy'){const g=CFG.gadgets.find(x=>x.id===v);if(!g||S.own.includes(g.id))return;if(S.bal<g.price){toast('Недостаточно средств');return}S.bal-=g.price;S.own.push(g.id);S.act=g.id;repayAll();save();render();toast('Куплено: '+g.n)}
 else if(a==='use'){const g=CFG.gadgets.find(x=>x.id===v);if(!g||!S.own.includes(v))return;S.act=v;repayAll();save();render();toast('Активен: '+g.n)}
 else if(a==='logout'){if(!lo){lo=1;t.classList.add('conf');t.lastChild.textContent='Точно выйти?';setTimeout(()=>{lo=0;if(t.isConnected){t.classList.remove('conf');t.lastChild.textContent='Выйти из аккаунта'}},4000)}else{lo=0;const f=S.fast;S=defS();S.fast=f;ensureDay();save();closeMenu();view='main';render();renderOnb()}}
 else if(a==='greg'){S.acct='google';save();render();toast('Бета: вход через Google пока без реальной авторизации')}
 else if(a==='reset'){if(!rst){rst=1;t.textContent='Нажмите ещё раз для подтверждения';setTimeout(()=>{rst=0;if(t.isConnected)t.textContent='Сбросить прогресс'},4000)}else{if(busy)return;const f=S.fast,ac=S.acct,nm=S.name;S=defS();S.fast=f;S.acct=ac;S.name=nm;save();closeM();render();toast('Прогресс сброшен')}}});
document.addEventListener('input',e=>{if(e.target.id==='q')pickList()});
document.addEventListener('change',e=>{const a=e.target.dataset.a;if(a==='fast'){S.fast=e.target.checked;save()}});
$('#hl').innerHTML=LOGO;load();ensureDay();repayAll();render();renderOnb();
</script></body></html>
